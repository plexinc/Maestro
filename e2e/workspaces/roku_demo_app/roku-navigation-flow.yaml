# Mirrors e2e/workspaces/vega_demo_app/vega-navigation-flow.yaml, adapted for Roku.
# Runs against the sideloaded e2e/roku_demo_app channel (appId `dev`) on a
# developer-mode Roku pinned via MAESTRO_ROKU_HOST.
#
# Sideload the channel first:
#   cd e2e/roku_demo_app && zip -r ../roku_demo_app.zip . && \
#   curl -f -u "rokudev:$MAESTRO_ROKU_PASSWORD" --digest \
#     -F "mysubmit=Install" -F "archive=@../roku_demo_app.zip" \
#     "http://$MAESTRO_ROKU_HOST/plugin_install"
appId: dev
tags:
  - roku
  - passing
---
- launchApp

# Home loads with the first menu item focused.
- assertVisible: "Home"
- assertVisible:
    id: "menu-navigation"
    focused: true

# Navigate down through the menu.
- pressKey: "Remote Dpad Down"
- assertVisible:
    id: "menu-text-input"
    focused: true
- pressKey: "Remote Dpad Down"
- assertVisible:
    id: "menu-focus"
    focused: true

# Navigate back up.
- pressKey: "Remote Dpad Up"
- pressKey: "Remote Dpad Up"
- assertVisible:
    id: "menu-navigation"
    focused: true

# Enter the Navigation Test screen.
- pressKey: "Remote Dpad Center"
- assertVisible: "Navigation Test"
- assertVisible:
    id: "grid-top-left"
    focused: true

# Move around the 2x2 grid with the D-pad.
- pressKey: "Remote Dpad Right"
- assertVisible:
    id: "grid-top-right"
    focused: true
- pressKey: "Remote Dpad Down"
- assertVisible:
    id: "grid-bottom-right"
    focused: true
- pressKey: "Remote Dpad Left"
- assertVisible:
    id: "grid-bottom-left"
    focused: true

# Focus the Back button and return Home.
- pressKey: "Remote Dpad Down"
- assertVisible:
    id: "back-button"
    focused: true
- pressKey: "Remote Dpad Center"
- assertVisible:
    id: "menu-navigation"
    focused: true
